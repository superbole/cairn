name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Set up temp HOME for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/home/.claude"
          echo "HOME=$RUNNER_TEMP/home" >> $GITHUB_ENV
      
      - name: Run test suite
        run: python plugins/cairn/tools/run_tests.py --timeout=300
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
      
      - name: List known failures (Linux)
        if: runner.os == 'Linux' && failure()
        run: |
          echo "Known failures on Linux (environment-sensitive tests):"
          echo "- test_check_credentials.py: requires Windows keychain"
          echo "- test_check_exits.py: expects Windows paths"
          echo "- test_issue_host.py: requires gh/glab CLIs"
          echo "- test_leak_patterns.py: requires ~/.claude/reentry-private-names.txt"
          echo "Expected: 33-34/38 passing on Linux"
  
  afk-conflict-check:
    name: Check afk/* PR conflicts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check afk/* branch conflicts
        run: |
          echo "## afk/* Branch Conflict Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Find all open afk/* PRs by listing remote branches
          afk_branches=$(git branch -r | grep 'origin/afk/' | sed 's|origin/||' | sort)
          
          if [ -z "$afk_branches" ]; then
            echo "No afk/* branches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "Found afk/* branches:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$afk_branches" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check each pair for merge conflicts
          echo "### Pairwise Conflict Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch A | Branch B | Status | Conflicting Files |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|--------|-------------------|" >> $GITHUB_STEP_SUMMARY
          
          IFS=$'\n'
          branches_array=($afk_branches)
          
          for ((i=0; i<${#branches_array[@]}; i++)); do
            for ((j=i+1; j<${#branches_array[@]}; j++)); do
              branch_a="${branches_array[$i]}"
              branch_b="${branches_array[$j]}"
              
              # Use git merge-tree to check for conflicts
              merge_result=$(git merge-tree $(git merge-base origin/main origin/$branch_a) origin/$branch_a origin/$branch_b 2>&1)
              
              if echo "$merge_result" | grep -q "^<<<<<"; then
                conflicts=$(echo "$merge_result" | grep -B 5 "^<<<<<" | grep "^+++ " | sed 's|^+++ b/||' | sort -u | tr '\n' ', ' | sed 's/,$//')
                echo "| \`$branch_a\` | \`$branch_b\` | ⚠️ **CONFLICT** | $conflicts |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| \`$branch_a\` | \`$branch_b\` | ✅ Clean | - |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_This check does not fail the build. It provides information about which afk/* PRs conflict with each other._" >> $GITHUB_STEP_SUMMARY
